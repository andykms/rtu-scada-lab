<div class="bar">
  <span
    class="option"
    paperText
    size="s"
    (click)="openedFileOptions.set(!openedFileOptions())"
  >
    {{ labels().file }}
    <paper-selector
      [variants]="fileOptions()"
      [open]="openedFileOptions()"
      size="s"
      (close)="openedFileOptions.set(false)"
      (selected)="onFileOptions($event)"
    ></paper-selector>
  </span>
  <span
    class="option"
    paperText
    size="s"
    (click)="openedSettingsOptions.set(!openedSettingsOptions())"
  >
    {{ labels().settings }}
    <paper-selector
      [variants]="settingsOptions()"
      [open]="openedSettingsOptions()"
      size="s"
      (close)="openedSettingsOptions.set(false)"
    ></paper-selector>
  </span>
  <span
    class="option"
    paperText
    size="s"
    (click)="openedDocumentationOptions.set(!openedDocumentationOptions())"
  >
    {{ labels().documentation }}
    <paper-selector
      [variants]="documentationOptions()"
      [open]="openedDocumentationOptions()"
      size="s"
      (close)="openedDocumentationOptions.set(false)"
    ></paper-selector>
  </span>
  <span
    class="option"
    paperText
    size="s"
    (click)="openedExitOptions.set(!openedExitOptions())"
  >
    {{ labels().exit }}
    <paper-selector
      [variants]="exitOptions()"
      [open]="openedExitOptions()"
      size="s"
      (close)="openedExitOptions.set(false)"
      (selected)="onExitOptions($event)"
    ></paper-selector>
  </span>

  @if (projectPath()) {
    <span class="project-path-wrap" [title]="projectPath()">
      <span class="project-path" paperText size="s">{{ projectPath() }}</span>
      @if (isDirty()) {
        <span class="project-dirty">*</span>
      }
    </span>
  }
  @else {
    <span class="project-path-wrap" [title]="projectNameLabel()">
      <span class="project-path" paperText size="s">{{ projectNameLabel() }} ({{ labels().unsaved }})</span>
    </span>
  }
</div>
