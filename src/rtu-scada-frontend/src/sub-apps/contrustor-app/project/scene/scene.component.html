<section
  class="scene-viewport"
  #viewport
  (wheel)="onViewportWheel($event)"
  (pointerdown)="onViewportPointerDown($event)"
  (pointermove)="onViewportPointerMove($event)"
  (pointerup)="onViewportPointerUp($event)"
  (pointercancel)="onViewportPointerUp($event)"
>
  <div class="scene-toolbar">
    <constructor-scene-actions-bar
      [mode]="mode()"
      (modeChange)="onModeChange($event)"
    />
  </div>

  <div
    class="scene-world"
    [class.delete-mode]="mode() === 'delete'"
    [class.edit-mode]="mode() === 'edit'"
    [style.transform]="worldTransform()"
  >
    <svg class="scene-edges" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker
          id="scene-arrow"
          viewBox="0 0 10 10"
          refX="9"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--primary-color)" />
        </marker>
      </defs>

      @for (edge of edgePaths(); track edge.edgeId) {
        @if (edge.d) {
          <path
            class="edge-hit"
            [class.active]="mode() === 'delete'"
            [attr.d]="edge.d"
            (pointerdown)="onEdgePointerDown(edge, $event)"
          />
          <path
            class="edge-line"
            [class.deletable]="mode() === 'delete'"
            [attr.d]="edge.d"
            marker-end="url(#scene-arrow)"
            (pointerdown)="onEdgePointerDown(edge, $event)"
          />
        }
      }

      @if (previewPath()) {
        <path class="edge-preview" [attr.d]="previewPath()" />
      }
    </svg>

    @for (node of nodes(); track node.nodeId) {
      <constructor-scene-block
        [node]="node"
        [style.left.px]="node.x"
        [style.top.px]="node.y"
        [dimmed]="isNodeDimmed(node)"
        [highlightPortId]="linkFromPort()?.portId ?? null"
        [linkMode]="mode() === 'link'"
        [deleteMode]="mode() === 'delete'"
        [editMode]="mode() === 'edit'"
        (portClick)="onPortClick($event)"
        (dragStart)="onNodeDragStart(node, $event)"
        (blockClick)="onBlockClick(node)"
      />
    }
  </div>
</section>
